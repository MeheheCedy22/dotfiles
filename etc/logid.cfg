devices: (
    {
        name: "MX Vertical Advanced Ergonomic Mouse";
        dpi: 1000;
        
        buttons: (
            // Top button (DPI button) mapped to Play/Pause
            {
                cid: 0xfd;
                action: {
                    type: "Keypress";
                    keys: ["KEY_PLAYPAUSE"];
                };
            },
            // Bottom thumb button (Back)
            {
                cid: 0x53;
                action: {
                    type: "Keypress";
                    keys: ["KEY_BACK"];
                };
            },
            // Top thumb button (Forward)
            {
                cid: 0x56;
                action: {
                    type: "Keypress";
                    keys: ["KEY_FORWARD"];
                };
            }
        );
    },
    {
        name: "LIFT VERTICAL ERGONOMIC MOUSE";
        dpi: 1000;
        
        buttons: (
            // Top button (DPI button) mapped to Play/Pause
            {
                cid: 0xfd;
                action: {
                    type: "Keypress";
                    keys: ["KEY_PLAYPAUSE"];
                };
            },
            // Bottom thumb button (Back)
            {
                cid: 0x53;
                action: {
                    type: "Keypress";
                    keys: ["KEY_BACK"];
                };
            },
            // Top thumb button (Forward)
            {
                cid: 0x56;
                action: {
                    type: "Keypress";
                    keys: ["KEY_FORWARD"];
                };
            }
        );
    }
);


